name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the checks change nothing on GitHub.
permissions:
  contents: read

# A new push to a branch cancels its run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Hugo of the build and the tests: the minimum of module.hugoVersion
# in hugo.toml. Keep them in sync.
env:
  HUGO_VERSION: @RUNTIME@

# Each job is a check a merge requires (.project-init.yml): keep their
# names in sync.
jobs:
  # Secrets in the whole history, with gitleaks' own image: the hooks of
  # init-machine check each commit on the machine, this check what reaches
  # GitHub from anywhere.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        # The checkout is the runner's user's, the container runs as root:
        # git refuses the repository, and gitleaks then scans no commit and
        # passes. The image's safe.directory is lost: GitHub sets HOME.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --verbose --no-banner

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Hugo modules run Go: the version go.mod names.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # As Hugo's documentation installs it.
      - name: Install Hugo
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      # The strict, minified build, its HTML and its internal links.
      - run: npm run build
      - run: npm run validate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Hugo modules run Go: the version go.mod names.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Hugo
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
