name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the checks change nothing on GitHub.
permissions:
  contents: read

# A new push to a branch cancels its run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secrets in the whole history, with gitleaks' own image: the hooks of
  # init-machine check each commit on the machine, this check what reaches
  # GitHub from anywhere.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        # The checkout is the runner's user's, the container runs as root:
        # git refuses the repository, and gitleaks then scans no commit and
        # passes. The image's safe.directory is lost: GitHub sets HOME.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --verbose --no-banner

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags (no @v10): pin the full version.
      - uses: astral-sh/setup-uv@v10.2.0
      # ruff only: neither the project nor its runtime dependencies.
      - run: uv run --locked --only-group dev ruff check
      - run: uv run --locked --only-group dev ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # mypy targets the oldest supported Python (python_version in
          # pyproject.toml), whatever runs it.
          python-version: "@PYTHON_NEWEST@"
          enable-cache: true
      - run: uv run --locked --group typecheck mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python. The job names are the
        # checks a merge requires (.project-init.yml): keep them in sync.
        python: [@PYTHON_MATRIX@]
    name: test (python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest
