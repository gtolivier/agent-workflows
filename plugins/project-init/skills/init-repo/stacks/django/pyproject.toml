
[tool.pytest.ini_options]
# The settings of the tests, even when DJANGO_SETTINGS_MODULE is exported.
addopts = ["--ds=config.settings"]
# Each app holds its tests: tests.py, or a tests/ package.
python_files = ["tests.py", "test_*.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",
    "C90",  # function complexity
    "N",    # PEP 8 naming
    "SIM",  # simplifications
    "RET",  # return statements
    "ARG",  # unused arguments
    "ERA",  # commented-out code
    "PL",   # pylint, including PLR2004 (magic values)
    "PGH",  # blanket `# noqa` / `# type: ignore` (no error code)
    "RUF100",  # unused `# noqa`
    "DJ",   # Django's conventions
]

[tool.ruff.lint.flake8-unused-arguments]
# `*args` / `**kwargs` that a signature requires (overridden methods).
ignore-variadic-names = true

[tool.ruff.lint.pylint]
# Magic values: flag strings too, not only numbers (the default allows
# "str" and "bytes").
allow-magic-value-types = []

[tool.ruff.lint.per-file-ignores]
# Literal examples are what tests are made of; pytest fixtures are often
# requested for their side effects only.
"**/tests.py" = ["PLR2004", "ARG001", "ARG002"]
"**/tests/**" = ["PLR2004", "ARG001", "ARG002"]
"**/test_*.py" = ["PLR2004", "ARG001", "ARG002"]
# Generated by makemigrations: long strings, and the (apps, schema_editor)
# signature of RunPython.
"**/migrations/**" = ["E501", "ARG001"]
# Generated by Django: the import inside main() is deliberate, and the
# password validators' names are long.
"manage.py" = ["PLC0415"]
"config/settings.py" = ["E501"]

[tool.mypy]
files = ["."]
exclude = ['^\.venv/', '/migrations/']
# The oldest supported Python, whatever interpreter runs mypy.
python_version = "@RUNTIME@"
strict = true
# A `# type: ignore` must name the error it silences.
enable_error_code = ["ignore-without-code"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# django-environ ships no type information.
module = ["environ"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
