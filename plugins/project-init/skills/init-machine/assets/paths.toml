# Absolute paths to a home folder (macOS, Linux, Windows). No [extend]: the
# default path allowlist of gitleaks (go.mod, package-lock.json, SVG files,
# /home/…) does not apply to this rule.
[[rules]]
id = "local-path"
description = "Absolute path to a home folder"
regex = '''(?:/Users/|/home/|(?i:[a-z]:\\{1,2}users\\{1,2}))[\p{L}\p{N}._-]+'''

# Shared and service accounts name no one: Docker images (node), CI runners.
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''^(?:/Users/|/home/)(?:Shared|Public|node|runner|ubuntu|vscode|circleci)$''',
  '''(?i)^[a-z]:\\{1,2}users\\{1,2}(?:Public|Default)$''',
]
