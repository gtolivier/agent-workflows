# Squash merges use the pull request title as the commit title, and
# release-please reads those commits: the title must be a Conventional Commit.
# `pull_request` rather than `pull_request_target`: it checks this branch's
# own configuration, and pull requests come from branches of this repository.
name: pr-title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  pr-title:
    # release-please titles its own PRs `chore(main): release …`; they are
    # generated, and `main` is not a plugin scope. Skipped only when both the
    # author and the branch are release-please's: a branch name alone can be
    # copied.
    if: >-
      ${{ !(github.event.pull_request.user.login == 'github-actions[bot]'
      && startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # One scope per plugin; repository-level changes take none.
          scopes: |
            tdd
